<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plush Moose</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb4d6; font: 14px/1.4 system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; left: 16px; top: 16px; max-width: calc(100vw - 32px);
        padding: 10px 14px; border-radius: 12px; color: #fff;
        background: rgba(20, 24, 30, .45); backdrop-filter: blur(8px);
        pointer-events: none; user-select: none;
      }
      #hud h1 { margin: 0 0 4px; font-size: 16px; }
      #hud p { margin: 0; opacity: .85; }
      #hud kbd { padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,.18); font: inherit; }
      #backend { margin-top: 6px !important; font-size: 12px; opacity: .6 !important; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Plush Moose</h1>
      <p>Explore the meadow of giant pints · click or tap the ground to walk there · <kbd>WASD</kbd>/arrows to steer · hold <kbd>Shift</kbd> to hurry · drag to orbit</p>
      <p id="backend"></p>
    </div>
    <div id="loading">Loading moose…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
